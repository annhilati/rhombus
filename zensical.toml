[project]
site_name = "Rhombus Documentation"
site_url = "https://annhilati.github.io/rhombus"
repo_url = "https://github.com/annhilati/rhombus"
repo_name = "rhombus"
nav = [
    {"Home" = [
        "index.md",
        "walkthrough.md"
    ]},
    {"Extension Developers" = [
        "extensions/density_functions.md"
    ]}
]

[project.theme]
# logo = "/logo.png"
# favicon = "/logo.png"
features = [
    "navigation.sections",
    "navigation.tabs"
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[project.theme.palette]
scheme = "slate"