[project]
site_name = "Rhombus Documentation"
site_url = "https://annhilati.github.io/rhombus"
repo_url = "https://github.com/annhilati/rhombus"
repo_name = "rhombus"
nav = [
    {"Worldgen Developers" = [
        "index.md",
        {"Get Started" = [
            "get-started/walkthrough.md",
            # "get-started/density.md",          
            # "get-started/extensions.md",
            # "get-started/datapack_development.md",
            "get-started/mod_development.md",
            "get-started/migration.md",
            "get-started/cli.md",
        ]},
        {"Reference" = [
            {"Standard Library" = "reference/rhombus/std/"},
            {"Rhombus" = "reference/rhombus/index.md"},
        ]}
    ]},
    {"Rhombus Developers" = [
        "devs/development.md",
        "devs/brand.md",
        "devs/macros.md",
        "devs/preview_endpoints.md",
        {"Adding Mod Support" = [
            "devs/abstraction.md",
        ]},
    ]}
]
extra_css = ["style.css"]

[project.theme]
logo = "images/logo.svg"
favicon = "images/logo.svg"
features = [
    "navigation.sections",
    "navigation.tabs",
    "content.code.annotate"
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[project.theme.palette]
scheme = "slate"
primary = "custom"

[project.extra]
generator = false

[project.extra.status]
new = "Recently added"

[project.markdown_extensions]
pymdownx.blocks.caption = {}
pymdownx.superfences = {}
pymdownx.tabbed = { alternate_style = true }
pymdownx.details = {}
pymdownx.emoji = { emoji_index = "zensical.extensions.emoji.twemoji", emoji_generator = "zensical.extensions.emoji.to_svg", options.custom_icons = ["overrides/.icons"] }
admonition = {}
footnotes = {}
attr_list = {}
md_in_html = {}