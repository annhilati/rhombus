[project]
site_name = "Rhombus Documentation"
site_url = "https://annhilati.github.io/rhombus"
repo_url = "https://github.com/annhilati/rhombus"
repo_name = "rhombus"
nav = [
    {"Worldgen Developers" = [
        "index.md",
        "walkthrough.md",
    ]},
    {"Rhombus Developers" = [
        "extending/macros.md",
        "extending/density_functions.md",
        "extending/docstring_guide.md"
    ]}
]
extra_css = ["style.css"]

[project.theme]
logo = "logo.png"
favicon = "logo.png"
features = [
    "navigation.sections",
    "navigation.tabs"
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[project.theme.palette]
scheme = "slate"
primary = "custom"

[project.extra]
generator = false

[project.extra.status]
new = "Recently added"

[project.markdown_extensions]
pymdownx.superfences = {}
pymdownx.tabbed = { alternate_style = true }
pymdownx.details = {}
admonition = {}
footnotes = {}