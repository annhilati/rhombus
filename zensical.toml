[project]
site_name = "Rhombus Documentation"
site_url = "https://annhilati.github.io/rhombus"
repo_url = "https://github.com/annhilati/rhombus"
repo_name = "rhombus"
nav = [
    {"Worldgen Developers" = [
        "index.md",
        "usage/walkthrough.md",
        {"Get Started" = [
            "syntax.md",
            "abstraction.md",
            # "cli.md",
            # "datapack_development.md",
            "mod_development.md",
        ]},
        {"Examples" = [
            "examples/conditionality.md"
        ]}
    ]},
    {"Rhombus Developers" = [
        "devs/development.md",
        "devs/brand.md",
        "devs/macros.md",
        {"Adding Mod Support" = [
            "devs/mod_support/index.md",
            {"🏗️ in Rework" = "devs/mod_support/index.md"}
            # "devs/mod_support/density_functions.md",
            # "devs/mod_support/datapack_resources.md",
            # "devs/mod_support/sub_parameters.md"
        ]},
    ]}
]
extra_css = ["style.css"]

[project.theme]
logo = "logo.png"
favicon = "logo.png"
features = [
    "navigation.sections",
    "navigation.tabs"
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[project.theme.palette]
scheme = "slate"
primary = "custom"

[project.extra]
generator = false

[project.extra.status]
new = "Recently added"

[project.markdown_extensions]
pymdownx.blocks.caption = {}
pymdownx.superfences = {}
pymdownx.tabbed = { alternate_style = true }
pymdownx.details = {}
pymdownx.emoji = { emoji_index = "zensical.extensions.emoji.twemoji", emoji_generator = "zensical.extensions.emoji.to_svg", options.custom_icons = ["overrides/.icons"] }
admonition = {}
footnotes = {}
attr_list = {}
md_in_html = {}