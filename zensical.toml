[project]
site_name = "Rhombus Documentation"
site_url = "https://annhilati.github.io/rhombus"
repo_url = "https://github.com/annhilati/rhombus"
repo_name = "rhombus"
nav = [
    {"Usage" = [
        "index.md",
        "walkthrough.md"
    ]},
    {"Extending" = [
        "extending/macros.md",
        "extending/density_functions.md"
    ]}
]

[project.theme]
logo = "/logo.png"
favicon = "/logo.png"
features = [
    "navigation.sections",
    "navigation.tabs"
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[project.theme.palette]
scheme = "slate"

[project.extra]
generator = false

[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
[project.markdown_extensions.admonition]
[project.markdown_extensions.pymdownx.details]
