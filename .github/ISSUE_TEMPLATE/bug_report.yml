name: Bug Report
description: Report a bug.
title: "[Bug]: "
labels: []
projects: []
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to make a design proposal!

        Please verify, that you used the newest version of Rhombus while encountering the issue.
  - type: input
    id: topic
    attributes:
      label: What component of Rhombus do you wish to make a proposal about?
      description: Please state the matter as short a possible, but as concrete as possible too.
      placeholder: Field validation for DensityFunction subclasses
    validations:
      required: true
  - type: textarea
    id: explanation
    attributes:
      label: How do you want to change or implement this component?
      description: Please clarify again which problem or missing feature you are referring to and then explain what kind of implementation you would like to propose. Feel free to use code examples.
      placeholder: "..."
      # value: "A bug happened!"
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](https://example.com).
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
