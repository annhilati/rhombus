[project]
name = "Rhombus"
version = "0.0.1"
description = ""
readme = "README.md"
requires-python = ">=3.8"
license = "EUPL-1.2"
authors = [
  { name = "Annhilati"},
]
dependencies = [
  "beet"
]

[project.urls]
"Homepage" = "https://github.com/annhilati/rhombus"
"Documentation" = "https://github.com/annhilati/rhombus"
# "Changelog" = "https://annhilati.gitbook.io/vpmobil/anderes/changelog"
"Repository" = "https://github.com/annhilati/rhombus"
"Bug Tracker" = "https://github.com/annhilati/rhombus/issues"
"Download" = "https://pypi.org/project/rhombus/"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["Rhombus", "Rhombus.core", "Rhombus.language", "Rhombus.macros", "Rhombus.support", "Rhombus.toolchain"]