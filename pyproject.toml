[project]
name = "rhombus"
version = "0.1.0-dev1"
description = ""
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
authors = [
  { name = "Annhilati"},
]
dependencies = [
  "beet==0.111.0", # -> pyyaml
  "typer==0.25.1",
  "rich==15.0.0",
  "numpy==2.3.3",
  "uvicorn==0.49.0",
  "watchdog==6.0.0",
  "fastapi==0.137.1",
  "matplotlib==3.11.0",
  "pillow==12.2.0"
]

[project.urls]
homepage = "https://github.com/annhilati/rhombus"
documentation = "https://annhilati.github.io/rhombus"
# "changelog" = ""
repository = "https://github.com/annhilati/rhombus"
issues = "https://github.com/annhilati/rhombus/issues"

# [project.scripts]
# rhombus = "rhombus.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rhombus"]
artifacts = ["rhombus/preview/dist"]

[tool.hatch.build.hooks.custom]
path = "rhombus-preview/build.py"